name: Test and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifequest-production
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend regression tests
        working-directory: frontend
        run: >-
          node --test
          src/composables/useNoteAutosave.test.mjs
          src/views/cultivation-regressions.test.mjs
          src/views/immortal-regressions.test.mjs
          src/views/localization-regressions.test.mjs
          src/views/sects-request-state.test.mjs
          src/views/ui-regressions.test.mjs

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to server
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Update systemd deployment
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_APP_DIR: ${{ secrets.SERVER_APP_DIR }}
        run: |
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          APP_DIR="${SERVER_APP_DIR:-/root/LifeQuest}"
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" \
            "bash '$APP_DIR/deploy/update-systemd.sh' '$APP_DIR'"
