name: Build Android Release

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version-check:
    name: Check Android version change
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^ HEAD -- frontend/android/app/build.gradle .github/workflows/android-release.yml; then
            echo "Android version and workflow did not change; skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build and publish APK
    needs: version-check
    if: needs.version-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Configure Android environment
        working-directory: frontend
        env:
          ANDROID_API_BASE_URL: ${{ secrets.ANDROID_API_BASE_URL }}
          ANDROID_UPDATE_MANIFEST_URL: ${{ secrets.ANDROID_UPDATE_MANIFEST_URL }}
        run: |
          test -n "$ANDROID_API_BASE_URL"
          MANIFEST_URL="${ANDROID_UPDATE_MANIFEST_URL:-https://github.com/${{ github.repository }}/releases/latest/download/latest.json}"
          printf 'VITE_API_BASE_URL=%s\nVITE_ANDROID_UPDATE_MANIFEST_URL=%s\n' \
            "$ANDROID_API_BASE_URL" "$MANIFEST_URL" > .env.android

      - name: Build web assets for Android
        working-directory: frontend
        run: npm run build:android

      - name: Sync Capacitor Android project
        working-directory: frontend
        run: |
          chmod +x android/gradlew
          npx cap sync android

      - name: Configure Android signing
        working-directory: frontend/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          cat > key.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed APK and AAB
        working-directory: frontend/android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Create release metadata
        working-directory: frontend/android
        id: metadata
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          VERSION_CODE=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle)
          export VERSION_NAME VERSION_CODE
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json, os
          version_name = os.environ['VERSION_NAME']
          version_code = os.environ['VERSION_CODE']
          repository = os.environ['REPOSITORY']
          manifest = {
              'versionName': version_name,
              'versionCode': int(version_code),
              'downloadUrl': f'https://github.com/{repository}/releases/latest/download/app-release.apk',
              'forceUpdate': False,
              'releaseNotes': f'LifeQuest {version_name} 更新。',
          }
          with open('latest.json', 'w', encoding='utf-8') as handle:
              json.dump(manifest, handle, ensure_ascii=False, indent=2)
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.metadata.outputs.version_name }}-${{ steps.metadata.outputs.version_code }}
          name: LifeQuest Android ${{ steps.metadata.outputs.version_name }}
          generate_release_notes: true
          files: |
            frontend/android/app/build/outputs/apk/release/app-release.apk
            frontend/android/app/build/outputs/bundle/release/app-release.aab
            frontend/android/latest.json
